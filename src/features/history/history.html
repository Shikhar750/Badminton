<div class="tab" id="tab-history">
  <div class="filter-row" id="date-filter-row">
    <div class="filter-pill active" data-date="all">All Time</div>
    <div class="filter-pill" data-date="week">This Week</div>
    <div class="filter-pill" data-date="month">This Month</div>
  </div>
  <div class="filter-row" id="result-filter-row">
    <div class="filter-pill active" data-result="all">All</div>
    <div class="filter-pill" data-result="win" id="history-win-filter">Team 1 Won</div>
    <div class="filter-pill" data-result="loss" id="history-loss-filter">Team 1 Lost</div>
  </div>
  <div class="history-pov" id="history-pov">Pin yourself to see wins and losses from your perspective.</div>
  <div class="hint" id="history-total-games" style="margin-bottom:12px"></div>
  <div id="history-content"></div>
  <div class="load-more-sentinel" id="history-sentinel"></div>
</div>
