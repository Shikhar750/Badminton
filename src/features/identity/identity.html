<div class="identity-bar" id="identity-bar">
  <button class="identity-avatar" id="identity-main" type="button" aria-label="Pin yourself">👤</button>
  <div class="identity-picker" id="identity-picker">
    <div class="identity-picker-title" id="identity-picker-title">Pin yourself</div>
    <select class="identity-select" id="identity-select" aria-label="Choose your player"></select>
    <div class="identity-actions">
      <button class="identity-save" id="identity-save" type="button">Pin me</button>
      <button class="identity-clear" id="identity-clear" type="button" style="display:none">Clear</button>
    </div>
    <button class="identity-stats" id="identity-stats" type="button" style="display:none">View My Stats</button>
    <div class="identity-note">Saved on this device only · never changes points</div>
  </div>
</div>
